<!-- @dsCard group="Brand" height=420 subtitle="White or black only" -->
<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500&family=Geist+Mono:wght@400;500&display=swap">
<style>
body{margin:0;padding:24px;background:var(--bg);color:var(--ink);font-family:var(--font-sans)}
.row{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.tile{display:flex;align-items:center;justify-content:center;height:150px;border-radius:var(--radius-sm)}
.cap{margin-top:8px;font-family:var(--font-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-subtle)}
.sizes{display:flex;align-items:flex-end;gap:32px;margin-top:24px}
</style>
</head>
<body>
<div id="root"></div>
<script>
var M = window.Multiplier, h = React.createElement;
function Tile(bg, node, cap, border) {
  return h('div', null, h('div', { className: 'tile', style: { background: bg, border: border || 'none' } }, node), h('div', { className: 'cap' }, cap));
}
ReactDOM.createRoot(document.getElementById('root')).render(h('div', null,
  h('div', { className: 'row' },
    Tile('var(--bg)', h(M.Logo, { tone: 'light', size: 40 }), 'White on bg', '1px solid var(--border)'),
    Tile('#F2F4F3', h(M.Logo, { tone: 'dark', size: 40 }), 'Black on light'),
    Tile('var(--action)', h(M.Logo, { tone: 'light', size: 40 }), 'White on action')
  ),
  h('div', { className: 'sizes' },
    h(M.Logo, { size: 24 }),
    h(M.Logo, { markOnly: true, size: 48 }),
    h(M.Logo, { markOnly: true, size: 16 })
  )
));
</script>
</body>
</html>
