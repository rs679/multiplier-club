<!-- @dsCard group="Deals" height=360 subtitle="Asset class, status, terms" -->
<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500&family=Geist+Mono:wght@400;500&display=swap">
<style>
body{margin:0;padding:24px;background:var(--bg);color:var(--ink);font-family:var(--font-sans)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:24px}
</style>
</head>
<body>
<div id="root"></div>
<script>
var M = window.Multiplier, h = React.createElement;
ReactDOM.createRoot(document.getElementById('root')).render(h('div', { className: 'grid' },
  h(M.DealCard, { assetClass: 'Private equity', title: '[Deal name]', summary: '[One-line thesis in plain English.]', minimum: '[amount]', fee: '[x]%', status: 'Open', action: h(M.Button, { variant: 'secondary' }, 'View deal') }),
  h(M.DealCard, { assetClass: 'Real assets', title: '[Deal name]', summary: '[One-line thesis in plain English.]', minimum: '[amount]', fee: '[x]%', status: 'Closing soon', statusTone: 'caution', action: h(M.Button, { variant: 'secondary' }, 'View deal') })
));
</script>
</body>
</html>
