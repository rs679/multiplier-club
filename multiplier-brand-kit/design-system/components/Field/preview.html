<!-- @dsCard group="Forms" height=260 subtitle="Default, hint, error" -->
<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500&family=Geist+Mono:wght@400;500&display=swap">
<style>
body{margin:0;padding:24px;background:var(--bg);color:var(--ink);font-family:var(--font-sans)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:24px}
</style>
</head>
<body>
<div id="root"></div>
<script>
var F = window.Multiplier.Field, h = React.createElement;
ReactDOM.createRoot(document.getElementById('root')).render(h('div', { className: 'grid' },
  h(F, { label: 'Work email', placeholder: 'name@firm.com', type: 'email' }),
  h(F, { label: 'Firm name', defaultValue: '[Firm]', hint: 'As registered with your regulator.' }),
  h(F, { label: 'Client minimum', defaultValue: '0', error: 'Enter an amount of at least [amount].' })
));
</script>
</body>
</html>
